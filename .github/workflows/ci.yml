name: CI

on:
  push:
    branches: ["main", "stage-*/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # GOD reads .blux/ through the BLUX Contract v1 SDK (not on PyPI yet): pinned to tag blux-sdk-v0.1.0.
          pip install "blux-sdk @ git+https://github.com/Outer-Void/blux.git@0b09a46a98a29cbdb108679f3ef5252b0b6881d1#subdirectory=sdk/python"
          pip install -e '.[dev]'
      - name: Lint and types
        run: make lint types
      - name: Tests
        run: make test
      - name: Wheel (clean venv)
        run: make wheel
      - name: GOD checks its own .blux/
        run: make check
