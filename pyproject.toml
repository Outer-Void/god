[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "god-cli"
version = "2.0.0"
description = "GOD: discovery for the BLUX ecosystem (projects, capabilities, commands). It never runs what it finds."
readme = "README.md"
authors = [{ name = "Outer Void", email = "outervoid.blux@gmail.com" }]
# Licence unchanged from the existing LICENSE file; any change is an owner decision (credits UNR-008).
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# GOD reads .blux/ only through the canonical BLUX SDK. blux-sdk is not on PyPI yet: install it from the
# tagged BLUX repository first (README "Install").
dependencies = ["blux-sdk>=0.1.0,<0.2"]
keywords = ["blux", "discovery", "registry", "capabilities"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "build>=1.2", "types-PyYAML"]

[project.urls]
Homepage = "https://github.com/Outer-Void/god"
Repository = "https://github.com/Outer-Void/god"
Changelog = "https://github.com/Outer-Void/god/blob/main/CHANGELOG.md"

[project.scripts]
god = "god.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["god*"]

[tool.setuptools.package-data]
god = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "A", "BLE", "RUF", "SIM", "PL", "C4", "N"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLC0415", "S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "BLE", "PLW1510", "N"]

[tool.ruff.lint.isort]
known-first-party = ["god"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
packages = ["god"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
